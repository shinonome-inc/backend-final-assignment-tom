<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}X Clone{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
</head>
<body class="bg-gray-100">
    <!-- Header Section -->
    <div class="bg-blue-600 p-4 flex justify-between items-center">
        <h1 class="text-white text-3xl"><a href="{% url 'tweets:home' %}">X Colne</a></h1>
        <div class="flex space-x-4">
            {% if user.is_authenticated %}
                <a href="{% url 'accounts:logout' %}" class="text-white hover:underline">Logout</a>
                <a href="{% url 'accounts:user_profile' user.username %}" class="text-white hover:underline">Profile</a>
            {% else %}
                <a href="{% url 'accounts:login' %}" class="text-white hover:underline">Login</a>
                <a href="{% url 'accounts:signup' %}" class="text-white hover:underline">Sign Up</a>
            {% endif %}
        </div>
    </div>
    
    <!-- Main Content -->
    <div class="container mx-auto p-4">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
